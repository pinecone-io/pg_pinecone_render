      - key: POSTGRES_DB
        value: pg_pinecone
      # Internal hostname for the private URL file written at start.
      # Not PGHOST: that name is read by libpq and can point Postgres
      # clients inside the entrypoint at the wrong address.
      - key: PRIVATE_HOST
        fromService:
          name: pg-pinecone
          type: pserv
          property: host
